aid: mojo-vision
name: Mojo Vision
description: 'Mojo Vision is a Saratoga, California semiconductor and display company
  building a "wafers-in, wafers-out" micro-LED platform. Founded in 2015, it originally
  developed the world''s smallest, densest dynamic display for an AR smart contact
  lens, then pivoted in 2023 to commercializing micro-LED displays and optical interconnects.
  Its platform combines a 300mm silicon architecture with GaN-on-Silicon emitters,
  proprietary quantum dots and micro-lens arrays, and has demonstrated a monolithic
  RGB panel at 4µm pixel pitch (6,350 ppi). Target markets are XR and AI-enabled glasses,
  automotive heads-up displays, large-format displays, and high-density optical I/O
  for AI infrastructure. Partners include Marvell, DigiLens and CY Vision; investors
  include Khosla Ventures, NEA, Future Ventures, HP Tech Ventures, Amazon''s Alexa
  Fund and Dolby Family Ventures. Mojo Vision is a hardware/silicon company and
  publishes no public developer API, SDK, or developer portal.'
